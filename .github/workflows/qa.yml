name: Skygate QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: skygate-qa-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Node tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: git diff --check

  browser:
    name: Chromium Game and Studio smoke
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: node scripts/prepare-play.mjs
      - run: python -m pip install --disable-pip-version-check playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python studio/tests/ci_browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skygate-qa-screenshots
          path: qa-ci/
          if-no-files-found: ignore
