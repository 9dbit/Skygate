name: Soft Tech native provider qualification
on:
  push:
    branches: [feat/softtech-provider-v1-20261109]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify checked-in approved engine sources
        run: |
          python3 - <<'PY'
          import json,hashlib,pathlib
          lock=json.loads(pathlib.Path('SOFTTECH_PROVIDER_SOURCE_LOCK.json').read_text())
          for name,expected in lock['sha256'].items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==expected,name
          print('PASS: checked-in math/art source lock; no archive extraction or source rewrite')
          PY
      - name: Native identity, recovery, accounting and math regression tests
        run: node --test tests/*.test.mjs
      - name: Verify real same-filesystem bind mount and fail-closed transitions
        run: sudo unshare --mount --propagation private "$(command -v node)" tests/native-volume-mount-fixture.mjs
      - name: Build production native image
        run: docker build --file Dockerfile --progress plain --tag softtech-skygate-native:ci .
      - name: Verify actual image entrypoint with and without a mounted volume
        run: |
          native_volume_fixture="$(mktemp -d)"
          trap 'sudo rm -rf "$native_volume_fixture"' EXIT
          docker run --rm -i --network none --entrypoint node softtech-skygate-native:ci --input-type=module - unmounted < tests/native-volume-image-probe.mjs
          docker run --rm -i --network none --mount "type=bind,source=$native_volume_fixture,target=/data" --entrypoint node softtech-skygate-native:ci --input-type=module - mounted < tests/native-volume-image-probe.mjs
