name: Studio iPhone viewport QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: studio-device-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  device:
    name: iPhone 15 Pro preview Chromium and WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: node scripts/prepare-play.mjs
      - run: python -m pip install --disable-pip-version-check playwright==1.55.0
      - run: python -m playwright install --with-deps chromium webkit
      - run: python studio/tests/device_preview_qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-iphone15pro-evidence
          path: qa-device/
          if-no-files-found: ignore
